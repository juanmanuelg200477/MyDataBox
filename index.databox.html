<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraBox — Gestión de Infraestructura</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- SIDEBAR -->
    <nav class="sidebar">
        <div class="sidebar-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="2" width="20" height="20" rx="3" />
                <line x1="2" y1="8" x2="22" y2="8" />
                <line x1="8" y1="2" x2="8" y2="8" />
            </svg>
            <div><span>InfraBox</span><small>Infrastructure</small></div>
        </div>

        <div class="sidebar-section">Organización</div>
        <div class="sidebar-item" data-view="dashboard" onclick="navigate('dashboard')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
            Dashboard
        </div>
        <div class="sidebar-item" data-view="regions" onclick="navigate('regions')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="10" r="3" />
                <path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 7 8 11.7z" />
            </svg>
            Regiones
        </div>
        <div class="sidebar-item" data-view="areas" onclick="navigate('areas')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="12" y1="3" x2="12" y2="21" />
            </svg>
            Áreas
        </div>

        <div class="sidebar-section">Contactos</div>
        <div class="sidebar-item" data-view="contacts" onclick="navigate('contacts')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            Contactos
        </div>

        <div class="sidebar-section">Infraestructura</div>
        <div class="sidebar-item" data-view="racks" onclick="navigate('racks')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="4" y="2" width="16" height="20" rx="2" />
                <line x1="8" y1="6" x2="16" y2="6" />
                <line x1="8" y1="10" x2="16" y2="10" />
                <line x1="8" y1="14" x2="16" y2="14" />
                <line x1="8" y1="18" x2="16" y2="18" />
            </svg>
            Bastidores
        </div>
        <div class="sidebar-item" data-view="devices" onclick="navigate('devices')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="1" y="4" width="22" height="16" rx="2" />
                <line x1="1" y1="10" x2="23" y2="10" />
                <circle cx="18" cy="7" r="1" />
                <circle cx="18" cy="14" r="1" />
            </svg>
            Dispositivos
        </div>

        <div class="sidebar-footer">
            <div class="sidebar-footer-user">
                <div class="sidebar-footer-avatar">JM</div>
                <div class="sidebar-footer-info">
                    <div>Admin</div>
                    <div>InfraBox v1.0</div>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="main">
        <div class="topbar">
            <div class="breadcrumb" id="breadcrumb">
                <span>InfraBox</span>
                <span class="sep">›</span>
                <span class="current">Dashboard</span>
            </div>
        </div>
        <div class="content" id="app"></div>
    </div>

    <!-- CARGA DE SCRIPTS MODULARES -->
    <script src="js/store.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/regions.js"></script>
    <script src="js/views/areas.js"></script>
    <script src="js/views/contacts.js"></script>
    <script src="js/views/racks.js"></script>
    <script src="js/views/devices.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
